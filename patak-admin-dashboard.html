<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patak Admin · Community Water Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ocean:#0A3D56;--ocean2:#0B2A3C;--teal:#0E7C86;--teal2:#0A5F68;--aqua:#5CC8D0;--mist:#E6F4F5;--bg:#F1F5F8;--card:#fff;--line:#DCE5EA;--line2:#EAF0F3;--ink:#0B2A3C;--muted:#5A7482;
--warn:#8A5A00;--warnb:#FFF1D6;--info:#1D5FA8;--infob:#E2EEFB;--ok:#1F7A4D;--okb:#DFF3E7;--bad:#B3261E;--badb:#FBE4E2;--neu:#4F6B78;--neub:#E9EFF2;--ind:#4338CA;--indb:#ECEBFF;
--r:12px;--sh:0 1px 2px rgba(11,42,60,.06),0 4px 14px rgba(11,42,60,.05)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
svg{display:block}
h1,h2,h3,h4{margin:0;font-family:'Bricolage Grotesque','Public Sans',sans-serif;letter-spacing:-.01em}
:focus-visible{outline:3px solid #1D5FA8;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}.xs{font-size:12px}.sm{font-size:13px}.b{font-weight:700}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.col{display:flex;flex-direction:column}.g8{gap:8px}.g12{gap:12px}.wrapx{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,520px)}
.lg-hero{background:var(--ocean);color:#fff;padding:56px 56px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-hero .brand{display:flex;align-items:center;gap:12px;font-family:'Bricolage Grotesque';font-weight:800;font-size:26px}
.lg-hero h1{font-size:clamp(30px,3.4vw,46px);line-height:1.08;font-weight:800;margin:min(16vh,120px) 0 14px;max-width:560px}
.lg-hero p{max-width:520px;opacity:.88;font-size:16px;line-height:1.55;margin:0}
.lg-hero ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px;max-width:520px}
.lg-hero li{display:flex;gap:10px;align-items:flex-start;font-size:14px;opacity:.92}
.lg-hero li svg{flex:none;margin-top:2px;color:var(--aqua)}
.lg-wave{position:absolute;left:0;right:0;bottom:0;opacity:.5;pointer-events:none}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px}
.lg-card{width:100%;max-width:400px}
.lg-card h2{font-size:28px;font-weight:800}
.fld{display:block;margin-top:14px}.fld>span{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.inp{width:100%;height:42px;border:1.5px solid #C4D3DA;border-radius:10px;padding:0 12px;background:#fff}
textarea.inp{height:auto;padding:10px 12px;min-height:84px;resize:vertical}
.inp:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(14,124,134,.18)}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:20px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}
.demo-btn{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-top:10px}
.demo-btn:hover{border-color:var(--teal);background:var(--mist)}
.demo-btn .ico{width:38px;height:38px;border-radius:10px;background:var(--mist);color:var(--teal2);display:grid;place-items:center;flex:none}
.demo-btn b{display:block}.demo-btn small{color:var(--muted);font-size:12.5px}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;border:1.5px solid transparent;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:var(--teal2)}
.btn-d{background:var(--ocean);color:#fff}.btn-d:hover{background:var(--ocean2)}
.btn-o{background:#fff;border-color:#BCCDD5;color:var(--ink)}.btn-o:hover{border-color:var(--teal);color:var(--teal2)}
.btn-r{background:#fff;border-color:#E6B8B4;color:var(--bad)}.btn-r:hover{background:var(--badb)}
.btn-g{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.link{color:var(--teal2);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.warn{background:var(--warnb);color:var(--warn)}.chip.info{background:var(--infob);color:#17497F}.chip.ok{background:var(--okb);color:#175E3B}.chip.bad{background:var(--badb);color:#8F1D17}.chip.neutral{background:var(--neub);color:var(--neu)}.chip.ind{background:var(--indb);color:var(--ind)}
.chip.sev-Low{background:#E2F2EE;color:#0B5A4F}.chip.sev-Moderate{background:#FFF1D6;color:#7A4E00}.chip.sev-High{background:#FBE4E2;color:#8F1D17}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--ocean);color:#CFE6EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;z-index:30}
.side .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;padding:2px 10px 18px}
.side .brand small{display:block;font-family:'Public Sans';font-weight:500;font-size:11px;opacity:.7;letter-spacing:.04em;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#CFE6EC;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(92,200,208,.18);color:#fff;font-weight:700}
.nav a.on:before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--aqua)}
.nav .badge{margin-left:auto;background:#E0525B;color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.side .foot{margin-top:auto;display:grid;gap:10px}
.link-box{background:rgba(255,255,255,.07);border-radius:12px;padding:12px;font-size:12.5px}
.link-box .st{display:flex;align-items:center;gap:7px;font-weight:700;color:#fff}
.link-box button{margin-top:8px}
.btn-s2{background:rgba(255,255,255,.14);color:#fff;height:32px;border-radius:8px;padding:0 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;width:100%;justify-content:center}
.btn-s2:hover{background:rgba(255,255,255,.22)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:20}
.top h1{font-size:20px;font-weight:800}
.top .who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.role-chip{background:var(--mist);color:var(--teal2);border-radius:999px;font-size:12px;font-weight:700;padding:4px 10px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--bg)}
.icon-btn .badge{position:absolute;top:2px;right:2px;background:#E0525B;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.content{padding:24px 28px 60px;max-width:1500px;width:100%}
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hd h2{font-size:26px;font-weight:800}
.hd p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:16px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card.flush{padding:0;overflow:hidden}
.card .ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}.g12c{grid-template-columns:1fr 2fr}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lab i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.kpi .num{font-family:'Bricolage Grotesque';font-size:34px;font-weight:800;line-height:1}
.kpi .hint{font-size:12px;color:var(--muted)}
button.kpi{cursor:pointer;transition:transform .12s,border-color .12s}
button.kpi:hover{border-color:var(--teal);transform:translateY(-1px)}
.alertbar{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;border:1px solid;margin-bottom:12px}
.alertbar.rec{background:#FFF4F2;border-color:#F0B9B2}
.alertbar.sug{background:#EAF3FD;border-color:#B7D3F0}
.alertbar .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.alertbar.rec .ai{background:#F8D3CE;color:var(--bad)}.alertbar.sug .ai{background:#CFE2F8;color:var(--info)}
.alertbar .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--bad)}
.alertbar.sug .tag{color:var(--info)}
.alertbar .acts{display:flex;gap:8px;margin-left:auto;flex:none;align-items:center}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#F6F9FA;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.sortable{cursor:pointer}table.t th.sortable:hover{color:var(--ink)}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:#F5FAFB}
table.t td.num,table.t th.num{text-align:right}
.pn{display:flex;align-items:center;gap:8px}
.ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.pn .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.filters select,.filters input{height:38px;border:1.5px solid #C4D3DA;border-radius:9px;background:#fff;padding:0 10px;min-width:130px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.searchbox{position:relative;flex:1;min-width:220px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{width:100%;padding-left:36px}
.pager{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--teal2);border-color:var(--teal)}
.tabs .ct{display:inline-block;margin-left:6px;background:var(--neub);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--neu)}

/* ---------- charts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0;width:100%;text-align:left;border-radius:6px}
button.hbar:hover{background:var(--bg)}
.hbar .tr{height:12px;background:#EDF3F5;border-radius:6px;overflow:hidden;display:flex}
.hbar .tr i{display:block;height:100%}
.hbar b{text-align:right}
.chart-svg text{font-family:'Public Sans',sans-serif;fill:#5A7482;font-size:11px}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-leg{display:grid;gap:6px;font-size:13px;flex:1;min-width:140px}
.donut-leg div{display:flex;align-items:center;gap:8px}
.donut-leg b{margin-left:auto}

/* ---------- map ---------- */
.mapshell{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#EAF3EE}
.mapshell svg.map{width:100%;height:100%;cursor:grab;touch-action:none}
.mapshell svg.map.drag{cursor:grabbing}
.maplbl{font-family:'Public Sans';font-size:8.5px;fill:#6D8A93;font-weight:600;letter-spacing:.02em;pointer-events:none}
.brgylbl{font-family:'Bricolage Grotesque';font-weight:700;font-size:13px;fill:#0A5F68;opacity:.75;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--sh)}
.mapctl button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.maplegend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;display:grid;gap:4px;max-width:200px}
.maplegend div{display:flex;gap:7px;align-items:center}
.pop{position:absolute;left:14px;top:14px;width:300px;max-width:calc(100% - 28px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(11,42,60,.22);padding:14px;z-index:5}
.pop table{width:100%;font-size:12.5px;margin-top:8px;border-collapse:collapse}
.pop td{padding:4px 0;border-bottom:1px solid var(--line2)}.pop td:first-child{color:var(--muted);width:42%}
.pulse{animation:pls 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pls{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- report detail ---------- */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.crumbs a{color:var(--teal2);font-weight:600;text-decoration:none}
.rv{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:170px 1fr;gap:0}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line2)}.kv>div:nth-child(odd){color:var(--muted);font-size:13px}
.photo{border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.photo .tag{position:absolute;left:10px;bottom:10px;background:rgba(11,42,60,.78);color:#fff;font-size:11.5px;padding:3px 9px;border-radius:999px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:78px 18px 1fr;gap:8px;padding-bottom:16px;position:relative}
.tl li .dt{font-size:12.5px;font-weight:700;color:var(--ink);padding-top:1px}
.tl li .pt{position:relative;display:flex;justify-content:center}
.tl li .pt i{width:12px;height:12px;border-radius:50%;background:var(--teal);margin-top:4px;position:relative;z-index:1;box-shadow:0 0 0 3px #fff}
.tl li .pt:after{content:'';position:absolute;top:16px;bottom:-20px;width:2px;background:var(--line)}
.tl li:last-child .pt:after{display:none}
.tl li .tx b{display:block;font-size:13.5px}.tl li .tx span{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;margin:2px 0 14px}
.stepper .s{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);flex:none;width:76px;text-align:center}
.stepper .s i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:#fff;font-style:normal;font-size:12px}
.stepper .s.on i{background:var(--teal);border-color:var(--teal);color:#fff}
.stepper .s.cur{color:var(--ink)}
.stepper .ln{flex:1;height:2px;background:var(--line);margin-bottom:20px}.stepper .ln.on{background:var(--teal)}
.act-stack{display:grid;gap:8px}
.rel-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;width:100%;text-align:left}
.rel-item:hover{border-color:var(--teal);background:#F5FAFB}
.note{display:flex;gap:10px;background:var(--infob);color:#17497F;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}
.note.warn{background:var(--warnb);color:#6B4500}.note.lock{background:var(--mist);color:#0A5560}.note.ok{background:var(--okb);color:#175E3B}.note.bad{background:var(--badb);color:#8F1D17}
.note svg{flex:none;margin-top:1px}

/* ---------- modal / drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(7,30,43,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(7,30,43,.4)}
.modal.wide{max-width:720px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 22px 6px}
.modal .mh h3{font-size:20px;font-weight:800;flex:1}
.modal .mb{padding:8px 22px 6px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;width:100%;text-align:left;background:#fff}
.opt.on{border-color:var(--teal);background:var(--mist)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid #9CB3BD;flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .rd{border-color:var(--teal)}.opt.on .rd:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--teal)}
.opt b{display:block}.opt small{color:var(--muted);font-size:12.5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;margin-top:6px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--teal)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100%;background:#fff;z-index:55;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(7,30,43,.18);display:flex;flex-direction:column}
.drawer .dh{padding:16px 18px;background:var(--ocean);color:#fff;display:flex;align-items:center;gap:10px}
.drawer .db{padding:16px 18px;overflow:auto;flex:1;background:#F6F9FA}
.phone-note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ocean2);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(7,30,43,.3);display:flex;gap:8px;align-items:center;animation:tin .25s ease-out}
.toast.ok svg{color:#7EE0A8}.toast.warn svg{color:#FFD27A}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.priv{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--teal2);background:var(--mist);border-radius:8px;padding:6px 10px}
.hamb{display:none}

/* ---------- walkthrough ---------- */
.wt{position:fixed;left:256px;bottom:16px;width:310px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(7,30,43,.22);z-index:40;max-height:70vh;overflow:auto}
.wt .wh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff}
.wt ol{list-style:none;margin:0;padding:8px 14px 12px}
.wt li{display:flex;gap:10px;font-size:12.5px;padding:5px 0;align-items:flex-start}
.wt li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.wt li.done i{background:var(--ok);border-color:var(--ok);color:#fff}.wt li.done span{color:var(--muted);text-decoration:line-through}

@media (max-width:1280px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.g21,.g12c,.rv{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}#login{grid-template-columns:1fr}.lg-hero{display:none}.wt{display:none}}
@media (max-width:900px){#app{grid-template-columns:64px 1fr}.side{padding:14px 8px}.side .brand span,.side .brand small,.nav a span,.side .foot .link-box{display:none}.nav a{justify-content:center;padding:12px}.nav .badge{position:absolute;top:2px;right:2px;margin:0}.side .brand{justify-content:center;padding:0 0 14px}.top{padding:0 16px}.content{padding:18px 16px 50px}.g6,.g5,.g3,.g2,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.g6,.g5,.g3,.g2,.g4{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}.hbar{grid-template-columns:100px 1fr 30px}.top .who .nm{display:none}}

function modalShell(title,body,foot,wide){return '<div class="scrim" data-scrim="1"><div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="mh"><h3>'+title+'</h3><button class="icon-btn" data-act="closeModal" aria-label="Close">'+ic('close',18)+'</button></div><div class="mb">'+body+'</div><div class="mf">'+foot+'</div></div></div>'}
const optBtn=(k,v,sel,t,d)=>'<button type="button" class="opt'+(sel?' on':'')+'" data-act="mset" data-k="'+k+'" data-v="'+esc(v)+'" role="radio" aria-checked="'+!!sel+'"><span class="rd"></span><span><b>'+t+'</b>'+(d?'<small>'+d+'</small>':'')+'</span></button>';
function groupPool(r){const sg=sugFor(r.id),ids=new Set(sg?sg.members:[r.id]);DB.reports.forEach(o=>{if(o.status==='pending'&&!o.group&&o.type===r.type&&o.brgy===r.brgy&&dist(o,r)<=40)ids.add(o.id)});return Array.from(ids).map(byId)}
function openModal(type,id){
 const r=byId(id);if(!r)return;const m={type:type,id:id};
 if(type==='verify')m.sev=r.userSev;
 if(type==='reject'){m.reason='';m.note=''}
 if(type==='dup'){const c=dupCandidates(r);m.orig=c.length?c[0].id:'';}
 if(type==='group'){const sg=sugFor(r.id),pool=groupPool(r);m.sel=pool.map(x=>x.id);m.join=sg&&sg.join?sg.join:''}
 if(type==='forward'){const sp=PROVIDERS.find(p=>p.types.indexOf(r.type)>-1);m.prov=sp?sp.n:PROVIDERS[0].n;m.note=''}
 if(type==='reopen'||type==='resolve'){m.note=''}
 if(type==='start'){m.who=assignedOf(r)||''}
 APP.modal=m;bump();
}

 mcheck:(d,e)=>{const m=APP.modal,i=m.sel.indexOf(d.id);if(i>-1)m.sel.splice(i,1);else m.sel.push(d.id);bump()},
 mOk:()=>modalOk(),
 reviewAlert:d=>{const u=units().find(x=>x.id===d.id);if(!u)return;DB.ack[u.id]=u.still;mark('review');go('reports',u.lastStill||u.lead.id)},
 reReview:d=>reReview(d.id),provAdv:d=>provAdvance(d.id),
 histTab:d=>{APP.f.hist.tab=d.t;bump()},exportCsv:()=>exportCsv(),
 nfilter:d=>{APP.f.notif=d.v;bump()},readAll:()=>{myNotifs().forEach(n=>n.read=true);bump()},
 notifGo:d=>{const n=DB.notifs.find(x=>x.id===d.id);if(!n)return;n.read=true;const rf=n.ref||'';
  if(rf.indexOf('rep:')===0)go('reports',rf.slice(4));else if(rf.indexOf('grp:')===0){const u=units().find(x=>x.id===rf.slice(4));if(u)go('reports',u.lead.id);else bump()}
  else if(rf==='sug'){go(isBO()?'dashboard':'reports')}else bump()},
 openDrawer:()=>{APP.drawer=true;bump()},closeDrawer:()=>{APP.drawer=false;bump()},simSubmit:()=>simSubmit(),simStill:d=>simStill(d.id),
 openResident:()=>Bridge.open(),toggleGuide:()=>{APP.guide=!APP.guide;bump()},resetDemo:()=>resetDemo()
};
A.openReport=d=>go('reports',d.id);
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(!t){if(e.target.dataset&&e.target.dataset.scrim){APP.modal=null;bump()}return}
 const a=t.dataset.act;if(!A[a])return;
 if(t.tagName==='A')e.preventDefault();
 if(a==='login'){e.preventDefault();doLogin();return}
 if(a==='mcheck')return;
 A[a](t.dataset,e);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.act==='mcheck'){A.mcheck(t.dataset,e);return}
 if(t.dataset.f){const p=t.dataset.f.split('.'),v=t.type==='checkbox'?t.checked:t.value;APP.f[p[0]==='rep'?'rep':p[0]][p[1]]=v;if(p[0]==='rep')APP.f.rep.page=1;if(p[0]==='map')APP.f.map.sel=null;if(p[0]==='map')delete MV.pmap;if(p[0]==='hist')APP.f.hist.page=1;bump();return}
 if(t.dataset.chg==='assign'){assignTo(t.dataset.id,t.value);return}
 if(t.dataset.chg==='switchBrgy'){APP.user.brgy=t.value;resetUI();if(APP.route.name==='report')APP.route={name:'reports',id:null};toast('Now viewing as an official of '+t.value);bump();return}
 if(t.dataset.sim){APP.sim[t.dataset.sim]=t.type==='checkbox'?t.checked:t.value;return}
 if(t.dataset.m&&APP.modal){APP.modal[t.dataset.m]=t.value;return}
 if(t.id==='lgB'){APP.loginBrgy=t.value}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.f&&t.type!=='checkbox'&&t.tagName==='INPUT'){const p=t.dataset.f.split('.');APP.f[p[0]][p[1]]=t.value;if(p[0]==='rep')APP.f.rep.page=1;bump();return}
 if(t.dataset.m&&APP.modal){APP.modal[t.dataset.m]=t.value;if(t.dataset.m==='orig')APP.modal.err=null;return}
 if(t.dataset.sim){APP.sim[t.dataset.sim]=t.value;return}
 if(t.id==='lgId')APP.lgId=t.value;if(t.id==='lgPw')APP.lgPw=t.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='lgform'){e.preventDefault();doLogin()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(APP.modal){APP.modal=null;bump()}else if(APP.drawer){APP.drawer=false;bump()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('svg [data-act]')){e.preventDefault();e.target.closest('[data-act]').dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
/* map pan + wheel zoom */
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('svg.map[data-int="1"]');if(!s||e.target.closest('[data-act]'))return;drag={id:s.dataset.map,x:e.clientX,y:e.clientY,vb:Object.assign({},MV[s.dataset.map]),rect:s.getBoundingClientRect(),moved:false,s:s}});
document.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;drag.s.classList.add('drag')}if(!drag.moved)return;
 const vb=drag.vb,k=drag.rect.width/vb.w,nx=Math.max(0,Math.min(720-vb.w,vb.x-dx/k)),ny=Math.max(0,Math.min(440-vb.h,vb.y-dy/k));
 MV[drag.id].x=nx;MV[drag.id].y=ny;drag.s.setAttribute('viewBox',nx.toFixed(1)+' '+ny.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1));
});
document.addEventListener('pointerup',()=>{if(!drag)return;const mv=drag.moved,id=drag.id;drag.s.classList.remove('drag');drag=null;if(!mv&&id==='pmap'&&APP.f.map.sel){APP.f.map.sel=null;bump()}});
document.addEventListener('wheel',e=>{const s=e.target.closest&&e.target.closest('svg.map[data-int="1"]');if(!s)return;e.preventDefault();const id=s.dataset.map,vb=MV[id],r=s.getBoundingClientRect();mapZoom(id,e.deltaY<0?1:-1,vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h)},{passive:false});

window.__patak={db:()=>DB,app:()=>APP};
render();
})();
</script>
</body>
</html>
