<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patak – Household Water &amp; Community Reports (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--pg-bg:#DCEEF1;--pg-ink:#0B2A3C;--pg-card:#FFFFFF;--pg-line:#BFD8DE;--pg-muted:#476471;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#071E2B;--pg-ink:#E6F3F6;--pg-card:#0E2E3F;--pg-line:#1E4558;--pg-muted:#9DBBC6}}
:root[data-theme="dark"]{--pg-bg:#071E2B;--pg-ink:#E6F3F6;--pg-card:#0E2E3F;--pg-line:#1E4558;--pg-muted:#9DBBC6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--pg-bg);color:var(--pg-ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;gap:36px;padding:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:#0B2A3C}
svg{display:block}
:focus-visible{outline:3px solid #1D5FA8;outline-offset:2px;border-radius:8px}

/* ---------- outer guide panel ---------- */
.panel{width:290px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:24px;padding:20px;max-height:calc(100vh - 24px);overflow:auto;color:var(--pg-ink)}
.panel h2{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;margin:0 0 4px}
.panel p{margin:0 0 12px;font-size:13px;color:var(--pg-muted);line-height:1.45}
.panel ol{list-style:none;margin:0 0 14px;padding:0}
.panel li{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:6px 0;color:var(--pg-ink)}
.panel li i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--pg-line);display:grid;place-items:center;margin-top:1px}
.panel li.done i{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.panel li.done span{color:var(--pg-muted);text-decoration:line-through}
.panel .pbtn{width:100%;min-height:42px;border-radius:12px;border:1.5px solid var(--pg-line);font-weight:700;font-size:14px;text-align:center}
@media (max-width:980px){.panel{display:none}}

/* ---------- device ---------- */
.device{--ink:#0B2A3C;--ocean:#0A3D56;--teal:#0E7C86;--teal2:#0A6670;--aqua:#5CC8D0;--mist:#E6F4F5;--foam:#F3F9FA;--line:#D3E4E8;--muted:#4F6B78;--ok:#1F7A4D;--okb:#DFF3E8;--warn:#8A5A00;--warnb:#FFF3D6;--bad:#B3261E;--badb:#FBE6E4;--info:#1D5FA8;--infob:#E3EEFB;--sun:#F2B134;
  position:relative;width:390px;height:min(844px,calc(100vh - 24px));background:var(--foam);color:var(--ink);border-radius:44px;box-shadow:0 0 0 9px #0B2A3C,0 28px 60px -12px rgba(7,30,43,.5);overflow:hidden;display:flex;flex-direction:column;flex:none}
@media (max-width:520px){body{padding:0;display:block}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;scrollbar-width:thin}
.view.enter>*{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',sans-serif;margin:0;letter-spacing:-.01em}
h3{font-size:17px}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.col{display:flex;flex-direction:column}
.g8{gap:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt4{margin-top:4px}

.appbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;flex:none}
.ab-t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.ab-s{font-size:13px;color:var(--muted);margin-top:1px}
.subbar{display:flex;align-items:center;gap:6px;padding:12px 12px 4px;flex:none}
.subbar .ab-t{font-size:20px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);flex:none}
.icon-btn.plain{background:none;border:0}
.dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 4px;border:2px solid var(--foam)}

.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 8px 20px -14px rgba(10,61,86,.35)}
.card.flat{box-shadow:none}
.card.tint{background:var(--mist);border-color:#C6E3E6;box-shadow:none}
.card h3{margin-bottom:2px}
.tap{cursor:pointer;width:100%;display:block}

.hero{background:var(--ocean);color:#fff;border-radius:30px;padding:18px;margin-top:10px;position:relative;overflow:hidden}
.hero .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.hero .big small{font-size:18px;font-weight:600;margin-left:3px;opacity:.85}
.hero .lab{font-size:13px;opacity:.85}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--aqua);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.lt{background:var(--mist)}.bar.lt>i{background:var(--teal)}
.wv{animation:wv 3.6s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-50px)}}
@media (prefers-reduced-motion:reduce){.wv{animation:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.info{background:var(--infob);color:var(--info)}.chip.neutral{background:#E8EDF0;color:#3C4F59}
.hero .chip{background:rgba(255,255,255,.16);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15px;text-align:center;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--teal);color:#fff}.btn-s{background:var(--mist);color:var(--teal2)}.btn-o{background:#fff;border:1.5px solid var(--line)}.btn-d{background:var(--bad);color:#fff}.btn-w{background:#fff;color:var(--ocean)}
.btn-ghost{color:var(--teal2);min-height:40px;padding:0 8px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}.btn.sm{min-height:38px;font-size:13px;padding:0 14px;border-radius:12px}
.link{color:var(--teal2);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:block;text-align:left;width:100%}
.tile .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted)}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.ico.teal{background:var(--mist);color:var(--teal2)}.ico.sun{background:#FFF0CC;color:#8A5A00}.ico.blue{background:var(--infob);color:var(--info)}.ico.green{background:var(--okb);color:var(--ok)}.ico.red{background:var(--badb);color:var(--bad)}.ico.grey{background:#E8EDF0;color:#3C4F59}

.seg{display:flex;background:#DCEBEE;border-radius:15px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:700;font-size:14px;color:#3C5766;text-align:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(10,61,86,.25)}
.field{margin-top:12px}
.field>label,.lbl{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.inp{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-size:16px}
textarea.inp{padding:12px 14px;min-height:96px;resize:none;line-height:1.4}
.inp:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(14,124,134,.18)}
.err{color:var(--bad);font-size:13px;margin-top:6px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.note{display:flex;gap:10px;background:var(--infob);color:#17497F;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:12px}
.note.warn{background:var(--warnb);color:#6B4500}.note.ok{background:var(--okb);color:#175E3B}.note.lock{background:#E6F4F5;color:#0A5560}
.note svg{flex:none;margin-top:1px}

.optcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:18px;border:2px solid var(--line);background:#fff;text-align:left;width:100%;min-height:96px}
.optcard.on{border-color:var(--teal);background:var(--mist)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}
.stepper button{width:56px;height:56px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center}
.stepper .n{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;font-weight:800;min-width:80px;text-align:center;line-height:1}

.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.li .t{font-weight:700;font-size:14.5px}.li .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.unread{background:#F0FAFB}

nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 8px;flex:none}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:#547282;min-height:52px;justify-content:center;border-radius:14px;text-align:center}
nav.tabs button .pl{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
nav.tabs button.on{color:var(--teal2);font-weight:700}
nav.tabs button.on .pl{background:var(--mist)}

.overlay{position:absolute;inset:0;z-index:40;pointer-events:none}
.overlay>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(7,30,43,.55);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:8px 18px 24px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#C9DADF;margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:#0B2A3C;color:#fff;border-radius:16px;padding:13px 15px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);animation:up .25s;z-index:60;pointer-events:none}
.cele{position:absolute;inset:0;background:rgba(7,30,43,.78);display:grid;place-items:center;padding:20px;animation:fade .2s;overflow:hidden}
.cele .box{background:#fff;border-radius:28px;padding:22px 20px;width:100%;text-align:center;position:relative;animation:pop .45s cubic-bezier(.2,1.3,.4,1);max-height:92%;overflow:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.checkc{width:76px;height:76px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px}
.checkc svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.conf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards;opacity:.95}
@keyframes fall{to{transform:translateY(780px) rotate(540deg);opacity:.2}}

.ptsbig{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;color:var(--teal2);line-height:1}
.badge{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:linear-gradient(145deg,#FFE29A,#F2B134);color:#6B4500;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.badge.locked{background:#E3EAED;color:#7B8E98;box-shadow:none}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bcard{text-align:center;padding:14px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);width:100%}
.bcard.locked{background:#F4F7F8}

.mapwrap{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#EAF3EE;margin-top:10px}
.mapwrap svg{width:100%;height:auto;touch-action:manipulation}
.maplbl{font-size:8.5px;fill:#566F7A;font-family:'Figtree',sans-serif;font-weight:600}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 28px -8px rgba(7,30,43,.5);animation:up .2s}
.legend{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:10px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.legend .pill{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px}
.pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.spin{animation:spin 0.9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.prog{display:flex;gap:6px;margin:6px 0 4px}.prog i{flex:1;height:6px;border-radius:3px;background:#CFE0E4}.prog i.on{background:var(--teal)}
.photo{border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;background:#DDEBEE}
.photo svg{width:100%;height:auto}
.photo .tag{position:absolute;left:8px;bottom:8px;background:rgba(11,42,60,.78);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600}
.tl{position:relative;padding-left:26px;margin-top:10px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;padding-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.tl .it.note::before{background:#fff;box-shadow:0 0 0 2px #8CA3AD}
.stp{display:flex;align-items:center;margin:14px 0 4px}
.stp .s{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:62px;font-size:11px;font-weight:700;color:#5A7480;text-align:center}
.stp .s i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#E3EAED;color:#5A7480;font-style:normal}
.stp .s.on i{background:var(--teal);color:#fff}.stp .s.cur i{box-shadow:0 0 0 4px rgba(14,124,134,.22)}.stp .s.on{color:var(--ink)}
.stp .ln{flex:1;height:3px;background:#E3EAED;margin:0 -8px 22px}.stp .ln.on{background:var(--teal)}
.wizfoot{position:sticky;bottom:-28px;margin:16px -16px -28px;padding:12px 16px 18px;background:linear-gradient(to top,var(--foam) 78%,rgba(243,249,250,0));display:flex;gap:10px}
.qr{width:150px;height:150px;margin:8px auto;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px}
.splash{position:absolute;inset:0;background:var(--ocean);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20}
.sc{display:flex;flex-direction:column;min-height:100%;padding-top:18px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.sw .tg{width:50px;height:30px;border-radius:15px;background:#C6D5DA;position:relative;flex:none;transition:background .2s}
.sw .tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw .tg.on{background:var(--teal)}.sw .tg.on::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:#0E7C86;height:36px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp td{padding:10px 0;border-top:1px solid var(--line)}table.cmp tr:first-child td{border-top:0}table.cmp td:last-child{text-align:right;font-weight:700}
</style>
</head>
<body>
<aside class="panel" id="panel" aria-label="Prototype guide"></aside>
<main class="device" id="device">
  <div class="view" id="view" role="region" aria-live="polite"></div>
  <nav class="tabs" id="nav" hidden aria-label="Main navigation"></nav>
  <div class="overlay" id="overlay"></div>
</main>

<script>
(function(){
'use strict';
/* =====================================================================
   Helpers
===================================================================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TODAY=new Date();TODAY.setHours(12,0,0,0);
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TK=dk(TODAY);
const mk=k=>{const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const addM=(key,n)=>{const p=key.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mName=(key,long)=>{const p=key.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleString('en-US',{month:long?'long':'short'})};
const mFull=key=>mName(key,true)+' '+key.split('-')[0];
const toD=d=>typeof d==='string'?new Date(d+'T12:00:00'):d;
const dFmt=d=>toD(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const dShort=d=>toD(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const daysIn=key=>{const p=key.split('-').map(Number);return new Date(p[0],p[1],0).getDate()};
const diffDays=(a,b)=>Math.round((toD(a)-toD(b))/864e5);
const ago=m=>m<1?'Just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':m<2880?'Yesterday':Math.floor(m/1440)+' days ago';
const nowTime=()=>pad(new Date().getHours())+':'+pad(new Date().getMinutes());
const fmtTime=t=>{const p=t.split(':').map(Number);return ((p[0]%12)||12)+':'+pad(p[1])+' '+(p[0]>=12?'PM':'AM')};
const peso=n=>'₱'+Number(n).toLocaleString('en-PH');

/* ---------- icons (24px stroke set) ---------- */
const ICONS={
home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',

function levelOf(pts){let l=LEVELS[0];LEVELS.forEach(x=>{if(pts>=x.min)l=x});return l}

 '<section class="card"><h3>Water-saving recommendations</h3><div class="list mt8">'+tips.map(t=>'<div class="li"><span class="ico '+t[0]+'">'+ic(t[1],18)+'</span><div class="sp"><div class="t">'+t[2]+'</div><div class="s">'+t[3]+'</div></div></div>').join('')+'</div></section>'+
 '<button class="btn btn-p block mt16" data-act="trackTab" data-v="add">'+ic('plus',20)+'Add a record</button>';

function tipsList(sm){
 const pc=perCap(sm.cur,daysIn(sm.lk)),t=[];
 t.push(pc>110?['blue','drop','Your use is about '+pc+' L per person a day','A common planning benchmark is around 110 L. Small habit changes can close the gap.']:['green','check','You are at about '+pc+' L per person a day','That is within a common 110 L benchmark. Keep it up!']);
 if(sm.trend==='Increasing')t.push(['red','search','Use is trending up','Check taps and toilets for leaks. A silent leak can waste several m³ a month.']);
 t.push(['teal','search','Do a quick leak check','Close all taps and see if the meter still moves. Do this once a month.']);
 if(S.user.practices.includes('Wash dishes with running tap'))t.push(['sun','dish','Switch to a dish basin','Washing in a basin instead of under a running tap can save a lot every day.']);
 else t.push(['sun','plant','Reuse rinse water','Use rinse water from rice or vegetables on your plants.']);
 t.push(['green','washer','Wash full laundry loads','Wait for a full load. It saves water and electricity.']);
 return t.slice(0,4);
}

SCREENS.result=()=>{
 mark('comparison');
 const r=F.result;if(!r)return subbar('Result')+'<div class="card">Nothing to show.</div>';
 const m1=mName(r.key,true);
 const head=r.prev==null?'First record saved for '+m1+'.':'You used '+f1(r.val)+' m³ '+(r.adj?'this month':'in '+m1)+', '+f1(Math.abs(r.pc))+'% '+(r.diff<0?'lower':r.diff>0?'higher':'the same')+' than '+(r.adj?'last month':mName(r.pk,true))+'.';
 const g=r.goal;
 return subbar(r.updated?'Record updated':'Record saved')+'<section class="hero" style="margin-top:6px"><div class="lab">'+mFull(r.key)+'</div><div style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-size:25px;line-height:1.2;margin-top:6px">'+head+'</div><div class="mt12">'+trendChip(r.trend)+'</div></section>'+
 '<section class="card"><h3>Comparison</h3><table class="cmp mt8"><tr><td>Current consumption</td><td>'+f1(r.val)+' m³</td></tr><tr><td>Previous consumption'+(r.pk?' ('+mName(r.pk)+')':'')+'</td><td>'+(r.prev!=null?f1(r.prev)+' m³':'–')+'</td></tr><tr><td>Difference</td><td style="color:'+(r.diff<=0?'var(--ok)':'var(--bad)')+'">'+(r.diff>0?'+':'')+f1(r.diff)+' m³ ('+(r.pc>0?'+':'')+f1(r.pc)+'%)</td></tr><tr><td>Trend</td><td>'+r.trend+'</td></tr><tr><td>Per person per day</td><td>'+perCap(r.val,daysIn(r.key))+' L</td></tr></table></section>'+
 (g?(g.met?'<div class="note ok mt12">'+ic('trophy',22)+'<div><b>Goal met!</b> You stayed under '+f1(g.target)+' m³ and earned +50 points.</div></div>':'<div class="note mt12" style="background:#E6F4F5;color:#0A5560">'+ic('info',22)+'<div>You didn\'t reach this month\'s goal. Your progress has been recorded and will help us recommend a more suitable goal next month.</div></div>'):'')+
 '<div class="col g8 mt16">'+(S.goal?'':'<button class="btn btn-p block" data-act="go" data-r="goals">View recommended goal</button>')+'<button class="btn '+(S.goal?'btn-p':'btn-o')+' block" data-act="tab" data-t="track">Back to overview</button></div>';
};

/* ---------- GOALS ---------- */
SCREENS.goals=()=>{
 mark('goal');
 const gp=goalProgress(),rec=recommend(),sm=summary();
 let h=subbar('Water-saving goals');
 if(S.goal){
  h+='<section class="card"><div class="row"><span class="ico teal">'+ic('target',20)+'</span><div class="sp"><div class="xs muted">Active goal · '+mFull(S.goal.monthKey)+'</div><div class="b">Reduce consumption by '+S.goal.pct+'%</div></div></div><div class="bar lt mt12" style="height:12px"><i style="width:'+Math.round(gp.p)+'%"></i></div><div class="row mt8"><span class="sm">Target: under <b>'+f1(S.goal.target)+' m³</b></span><span class="sp"></span><span class="sm b">'+Math.round(gp.p)+'%</span></div><div class="xs muted mt4">'+(gp.e?'Estimated '+f1(gp.e.est)+' m³ based on meter readings to '+dShort(gp.e.upto)+'.':'Add meter readings for an estimate.')+' Based on '+mName(prevKeyOf(S.goal.monthKey)||S.goal.monthKey,true)+' ('+f1(S.goal.base)+' m³).</div><div class="row mt12"><button class="btn btn-o sp" data-act="adjustGoal">Adjust goal</button><button class="btn btn-p sp" data-act="go" data-r="trackAdd">Log '+mName(S.goal.monthKey)+' result</button></div></section>';
 }else{
  h+='<section class="hero" style="margin-top:8px"><div class="row"><span class="chip">'+ic('sparkle',13)+(rec.tier==='challenging'?'A bigger challenge':rec.tier==='gentle'?'A gentle step':'Steady goal')+'</span></div><div class="lab mt12">Recommended goal for '+mFull(rec.monthKey)+'</div><div style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-size:30px;line-height:1.1;margin-top:6px">Reduce this month\'s consumption by '+rec.pct+'%.</div><div class="mt8" style="opacity:.9">Target: under <b>'+f1(rec.target)+' m³</b> (from '+f1(rec.base)+' m³ in '+mName(rec.lk,true)+')</div><div class="row mt16"><button class="btn btn-w sp" data-act="acceptGoal">Accept goal</button><button class="btn sp" style="background:rgba(255,255,255,.16);color:#fff" data-act="adjustGoal">Adjust goal</button></div></section>'+
  '<section class="card"><h3>Why this goal?</h3><p class="sm muted" style="margin:4px 0 8px">'+rec.why+'</p><div class="list"><div class="li"><span class="ico teal">'+ic('users',18)+'</span><div class="sp t">Household size: '+S.user.people+' people</div></div><div class="li"><span class="ico blue">'+ic('chart',18)+'</span><div class="sp t">Last month: '+f1(sm.cur)+' m³ ('+perCap(sm.cur,daysIn(sm.lk))+' L per person a day)</div></div><div class="li"><span class="ico green">'+ic('check',18)+'</span><div class="sp t">Goals met: '+S.goalHistory.filter(g=>g.met).length+' of '+S.goalHistory.length+' recorded</div></div><div class="li"><span class="ico sun">'+ic('flag',18)+'</span><div class="sp t">Your chosen goal: '+S.baseline.goalPct+'% per month</div></div></div><p class="hint">We never recommend a goal that would take you below about 110 L per person per day.</p></section>';
 }
 h+='<section class="card"><h3>Goal history</h3><div class="list mt8">'+S.goalHistory.slice().reverse().map(g=>'<div class="li"><span class="ico '+(g.met?'green':'teal')+'">'+ic(g.met?'check':'target',18)+'</span><div class="sp"><div class="t">'+mFull(g.monthKey)+': '+g.pct+'% less</div><div class="s">Target '+f1(g.target)+' m³ · actual '+f1(g.actual)+' m³</div></div><span class="chip '+(g.met?'ok':'info')+'">'+(g.met?'Met':'Progress recorded')+'</span></div>').join('')+'</div><p class="hint">Missing a goal never removes points. Every result helps us suggest a better goal next month.</p></section>';

};

 return subbar('Achievements')+'<section class="card"><div class="row"><span class="ico blue" style="width:46px;height:46px">'+ic('trophy',24)+'</span><div class="sp"><div class="xs muted">Current level</div><div class="b" style="font-size:18px">Level '+lv.n+' · '+lv.name+'</div></div></div><div class="bar lt mt12" style="height:12px"><i style="width:'+Math.round(lvlPct(S.lifetime))+'%"></i></div><div class="xs muted mt8">'+S.lifetime+' lifetime points'+(nx?' · '+(nx.min-S.lifetime)+' to Level '+nx.n+' ('+nx.name+')':' · top level reached')+'</div><div class="list mt12">'+LEVELS.map(l=>'<div class="li" style="padding:8px 0"><span class="ico '+(S.lifetime>=l.min?'green':'grey')+'" style="width:28px;height:28px;border-radius:9px">'+ic(S.lifetime>=l.min?'check':'lock',14,2.6)+'</span><div class="sp t">Level '+l.n+' · '+l.name+'</div><span class="xs muted">'+l.min+'+ pts</span></div>').join('')+'</div></section>'+
 '<h3 style="margin:18px 4px 0">Earned ('+earned.length+')</h3><div class="bgrid mt8">'+earned.map(card).join('')+'</div>'+

};

/* ---------- REPORT TAB ---------- */
function newW(){return {step:1,type:null,desc:'',sev:null,date:TK,time:nowTime(),loc:null,locating:false,pick:false,photo:null,err:null,done:null}}
SCREENS.report=()=>{
 const tab=F.reportTab||'new',mine=S.reports.length;
 return appbar('Report a problem','Help your barangay fix water issues')+'<div class="seg" role="tablist">'+[['new','New report'],['mine','My reports ('+mine+')'],['map','Community map']].map(t=>'<button role="tab" aria-selected="'+(tab===t[0])+'" class="'+(tab===t[0]?'on':'')+'" data-act="reportTab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+RTABS[tab]();
};
const RTABS={};
RTABS.new=()=>{
 if(W.done)return reportDone();
 const st=W.step;let b='';
 const head='<div class="prog" aria-label="Step '+st+' of 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=st?'on':'')+'"></i>').join('')+'</div><div class="row"><span class="xs muted">Step '+st+' of 5</span><span class="sp"></span><span class="xs b">'+['','Issue type','Details','Location','Photo','Review'][st]+'</span></div>';
 if(st===1)b='<h2 class="mt12">What kind of problem is it?</h2><div class="grid2 mt12">'+Object.keys(TYPES).map(k=>'<button class="optcard '+(W.type===k?'on':'')+'" data-act="wType" data-v="'+k+'" aria-pressed="'+(W.type===k)+'">'+tIcon(k,22)+'<span class="b sm">'+TYPES[k].l+'</span></button>').join('')+'</div>'+(W.err?'<div class="err">'+W.err+'</div>':'');
 if(st===2)b='<h2 class="mt12">Tell us what is happening</h2><div class="field"><label for="wDesc">Description</label><textarea class="inp" id="wDesc" maxlength="300" data-f="wDesc" placeholder="Describe the problem and where exactly it is.">'+esc(W.desc)+'</textarea><div class="row"><span class="hint sp">Be specific: what you see, how long, how big.</span><span class="hint" id="descCount">'+W.desc.length+'/300</span></div><button class="link sm mt8" data-act="wSample">Fill a sample description</button></div><div class="field"><span class="lbl">How severe do you think it is?</span><div class="seg" style="margin-top:0" role="group" aria-label="Severity">'+['Low','Moderate','High'].map(s=>'<button class="'+(W.sev===s?'on':'')+'" data-act="wSev" data-v="'+s+'" aria-pressed="'+(W.sev===s)+'">'+s+'</button>').join('')+'</div><div class="note mt8">'+ic('info',18)+'<div>This is <b>your</b> assessment. Authorized personnel will review the report and decide the final severity.</div></div></div><div class="grid2"><div class="field"><label for="wDate">Date</label><input class="inp" id="wDate" data-f="wDate" type="date" max="'+TK+'" value="'+W.date+'"></div><div class="field"><label for="wTime">Time</label><input class="inp" id="wTime" data-f="wTime" type="time" value="'+W.time+'"></div></div>'+(W.err?'<div class="err" role="alert">'+W.err+'</div>':'');
 if(st===3)b='<h2 class="mt12">Where is it?</h2><div class="row mt12"><button class="btn btn-p sp" data-act="wLocate">'+(W.locating?'<span class="spin">'+ic('refresh',18)+'</span>Locating…':ic('pin',18)+'Use current location')+'</button><button class="btn '+(W.pick?'btn-p':'btn-o')+' sp" data-act="wPick">'+ic('map',18)+'Select on map</button></div>'+(W.pick?'<div class="hint">Tap anywhere on the map to drop a pin.</div>':'')+
  '<div class="mapwrap"><svg viewBox="0 0 360 440" data-act="mapPick" role="img" aria-label="Interactive demo map. Tap to place a pin." style="cursor:'+(W.pick?'crosshair':'default')+'">'+mapBase()+meSvg()+(W.loc?pinSvg(W.loc.x,W.loc.y):'')+'</svg></div>'+
  (W.loc?'<div class="card flat"><div class="row"><span class="ico red">'+ic('pin',18)+'</span><div class="sp"><div class="b">'+esc(W.loc.addr)+'</div><div class="xs muted">Detected barangay: <b>'+esc(W.loc.brgy)+'</b></div></div></div><div class="hint">Demo location detection. A real build would use GPS and barangay boundary data.</div></div>':'<div class="note warn">'+ic('pin',18)+'<div>No location selected yet. Use your current location or tap the map.</div></div>')+(W.err?'<div class="err" role="alert">'+W.err+'</div>':'');
 if(st===4)b='<h2 class="mt12">Add a photo</h2><p class="muted sm" style="margin:6px 0 0">A clear photo helps officials verify and prioritise faster. Avoid including people or private property.</p>'+(W.photo?'<div class="mt12">'+photoArt(W.type,W.photo.kind==='camera'?'Taken just now (demo)':'Uploaded (demo)')+'</div><div class="row mt12"><button class="btn btn-o sp" data-act="wPhoto" data-v="'+(W.photo.kind==='camera'?'camera':'upload')+'">'+ic('refresh',18)+'Retake</button><button class="btn btn-o sp" data-act="wPhotoRm">'+ic('trash',18)+'Remove</button></div>':'<div class="grid2 mt12"><button class="optcard" data-act="wPhoto" data-v="camera">'+'<span class="ico teal">'+ic('camera',22)+'</span><span class="b">Take photo</span><span class="xs muted">Use camera</span></button><button class="optcard" data-act="wPhoto" data-v="upload"><span class="ico blue">'+ic('upload',22)+'</span><span class="b">Upload photo</span><span class="xs muted">From gallery</span></button></div><div class="hint">Demo: choosing an option attaches a placeholder photo.</div>');
 if(st===5){

  const row=(l,v,s)=>'<div class="li" style="align-items:flex-start"><div class="sp"><div class="xs muted">'+l+'</div><div class="b" style="font-size:14.5px;margin-top:2px">'+v+'</div></div><button class="link sm" data-act="wStep" data-v="'+s+'">Edit</button></div>';
  b='<h2 class="mt12">Review your report</h2><div class="card flat list" style="padding:4px 16px">'+row('Issue type',TYPES[W.type].l,1)+row('Description',esc(W.desc),2)+row('Your severity estimate',W.sev+' <span class="xs muted">(final severity set by officials)</span>',2)+row('Date and time',dFmt(W.date)+', '+fmtTime(W.time),2)+row('Location',esc(W.loc.addr)+'<br><span class="xs muted">'+esc(W.loc.brgy)+'</span>',3)+'</div>'+(W.photo?'<div class="mt12">'+photoArt(W.type,'Attached photo')+'</div>':'<div class="note warn">'+ic('camera',18)+'<div>No photo attached. Reports with photos are verified faster. <button class="link" data-act="wStep" data-v="4">Add photo</button></div></div>')+(near?'<div class="note">'+ic('layers',18)+'<div><b>Similar issue nearby.</b> '+TYPES[near.type].l+' on '+esc(near.addr)+' already has '+near.rel+' related reports. Yours will be linked to it, not shown as a separate public issue.</div></div>':'')+'<div class="note lock">'+ic('lock',18)+'<div>Officials only see this report. Your name and contact details are never shown publicly.</div></div>';
 }
 const foot='<div class="wizfoot">'+(st>1?'<button class="btn btn-o" data-act="wBack" style="flex:none">Back</button>':'')+'<button class="btn btn-p sp" data-act="wNext">'+(st===5?'Submit report':st===4&&!W.photo?'Skip photo':'Continue')+'</button></div>';
 return '<div class="mt12">'+head+b+foot+'</div>';
};
function reportDone(){
 const r=W.done;
 return '<div class="card" style="text-align:center;margin-top:16px"><div class="checkc">'+ic('check',40,3)+'</div><h2>Report submitted successfully.</h2><p class="muted sm" style="margin:6px 0 12px">Thank you for helping your community.</p><div style="background:var(--mist);border-radius:16px;padding:12px"><div class="xs muted">Report ID</div><div style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-size:28px;letter-spacing:.02em">'+r.id+'</div><div class="mt8">'+stChip('pending')+'</div></div>'+(r.nearNote?'<div class="note" style="text-align:left">'+ic('layers',18)+'<div>'+r.nearNote+'</div></div>':'')+'<div class="stp">'+FLOW.map((s,i)=>(i?'<div class="ln"></div>':'')+'<div class="s '+(i===0?'on cur':'')+'"><i>'+(i===0?ic('check',14,3):i+1)+'</i>'+ST[s].l+'</div>').join('')+'</div><p class="xs muted">Officials review every report. We will notify you when the status changes. You earn +30 points once it is verified.</p></div><div class="col g8 mt12"><button class="btn btn-p block" data-act="viewNew" data-id="'+r.id+'">View my report</button><button class="btn btn-o block" data-act="wReset">Report another problem</button></div>';
}

 (FLOW.includes(r.status)&&r.status!=='resolved'?'<div class="card tint" style="border-style:dashed"><div class="xs b">Prototype control</div><p class="xs muted" style="margin:4px 0 8px">Simulate an official updating this report so you can see notifications, points and the map respond.</p><button class="btn btn-s sm" data-act="advance" data-id="'+r.id+'">Simulate: move to '+ST[FLOW[idx+1]].l+'</button></div>':'');

   Actions
===================================================================== */
function enterApp(){S.tab='home';R.stack=[];R.name='home';R.params={};mark('login');render(true)}
function defMonth(){return S.records[mk(-1)]?(slots().filter(s=>s.val==null).pop()||{key:mk(-1)}).key:mk(-1)}
function saveBill(){
 const key=F.billMonth||defMonth(),val=parseFloat(F.billVal);F.err={};
 if(!(val>0)||val>300){F.err.billVal='Enter your total consumption in m³ (for example 18.4).';render(false);return}
 const updated=!!S.records[key],pk=prevKeyOf(key),prev=pk?S.records[pk].val:null;
 const amt=parseFloat(F.billAmt);
 S.records[key]={val:val,amount:amt>0?amt:null,billDate:F.billDate||TK,via:'bill'};
 const diff=prev!=null?val-prev:0,pc=prev?diff/prev*100:0;
 const res={key:key,val:val,pk:pk,prev:prev,diff:diff,pc:pc,trend:prev!=null?trendOf(pc):'Stable',updated:updated,adj:pk===addM(key,-1),goal:null};
 let before=snap(),badges=[],pts=0;
 if(S.goal&&S.goal.monthKey===key){
  const g=S.goal,met=val<=g.target;
  S.goalHistory.push({monthKey:key,pct:g.pct,target:g.target,actual:val,met:met});
  res.goal={met:met,target:g.target};S.goal=null;
  if(met){S.goalsMet++;addPoints(50,'Goal met: '+mName(key,true));pts+=50;notify('star','Goal met! You earned +50 points.','goals');badges=checkBadges();pts+=badges.length*25}
  else notify('info','Your '+mName(key,true)+' goal was not reached. Your progress has been recorded to help set a better goal.','goals');
 }
 notify('chart','Your '+mName(key,true)+' water entry was saved ('+f1(val)+' m³).','track');
 F.result=res;F.billVal='';F.billAmt='';F.billMonth=null;F.err=null;
 mark('entry');
 go('result',{});
 if(pts)celebrate({title:'Goal met!',sub:'You used '+f1(val)+' m³, under your '+f1(res.goal.target)+' m³ goal.',pts:pts,before:before,badges:badges,cta:'See my results'});
}
function saveMeter(){
 const v=parseFloat(F.meterVal),d=F.meterDate||TK;F.err={};
 const last=S.meters.slice().sort((a,b)=>a.date<b.date?-1:1).pop();
 if(!(v>0)){F.err.meterVal='Enter the number shown on your meter.';render(false);return}
 if(v<=last.val){F.err.meterVal='This reading must be higher than your last one ('+last.val.toLocaleString()+' m³).';render(false);return}
 if(d<last.date){F.err.meterVal='The date cannot be before your last reading ('+dFmt(last.date)+').';render(false);return}
 const days=Math.max(1,diffDays(d,last.date)),used=v-last.val;
 S.meters.push({date:d,val:Math.round(v*10)/10});F.meterVal='';F.err=null;
 const e=estimate();
 notify('chart','Meter reading saved: '+v.toLocaleString()+' m³.','track');
 render(false);
 sheet('<div class="center" style="text-align:center"><div class="checkc" style="width:60px;height:60px">'+ic('check',30,3)+'</div><h3>Reading saved</h3></div><table class="cmp mt8"><tr><td>Since '+dShort(last.date)+' ('+days+' day'+(days>1?'s':'')+')</td><td>'+f1(used)+' m³</td></tr><tr><td>Daily average</td><td>'+Math.round(used/days*1000)+' L</td></tr><tr><td>Per person per day</td><td>'+perCap(used,days)+' L</td></tr>'+(e&&S.goal?'<tr><td>Projected for '+mName(S.goal.monthKey,true)+'</td><td>'+f1(e.est)+' m³</td></tr><tr><td>Goal target</td><td>'+f1(S.goal.target)+' m³</td></tr>':'')+'</table><p class="hint">Add your monthly bill when it arrives to lock in your result.</p><button class="btn btn-p block mt12" data-act="closeSheet">Done</button>');
}
function startReport(){W=newW();F.reportTab='new';mark('report');setTab('report')}
function wNext(){
 W.err=null;
 if(W.step===1&&!W.type)W.err='Please choose the type of problem.';
 if(W.step===2){if(W.desc.trim().length<10)W.err='Please add a short description (at least 10 characters).';else if(!W.sev)W.err='Please choose how severe you think it is.';else if(!W.date||!W.time)W.err='Please enter the date and time.'}
 if(W.step===3&&!W.loc)W.err='Please set a location first.';
 if(W.err){render(false);return}
 if(W.step===5){submitReport();return}
 W.step++;render(true);
}
function submitReport(){
 const id='WR-'+(S.nextId++),near=nearIssue(W.type,W.loc);
 const rep={id:id,type:W.type,desc:W.desc.trim(),sev:W.sev,date:W.date,time:W.time,addr:W.loc.addr,brgy:W.loc.brgy,status:'pending',issue:near?near.id:null,official:null,photo:W.photo?W.type:null,pt:{x:W.loc.x,y:W.loc.y},still:0,tl:[{s:'pending',d:TK,note:'Report received. Waiting for review.'}]};
 S.reports.unshift(rep);
 if(near){near.rel++;rep.nearNote='Similar issue found nearby ('+TYPES[near.type].l+', '+esc(near.addr)+'). Your report was linked to it, so the public map still shows one issue with '+near.rel+' related reports.'}
 notify('mega','Report #'+id+' was submitted. We will notify you when it is reviewed.','rep:'+id);
 W.done=rep;mark('submit');render(true);
}
function advance(id){
 const r=S.reports.find(x=>x.id===id),i=FLOW.indexOf(r.status);if(i<0||i>=3)return;
 const ns=FLOW[i+1],notes={verified:'Verified by barangay personnel.',progress:'Repair crew assigned.',resolved:'Marked resolved by the barangay.'};
 r.status=ns;r.tl.push({s:ns,d:TK,note:notes[ns]});
 if(ns==='verified'){
  r.official=r.sev==='High'?'High':'Moderate';
  if(!r.issue){const iss={id:'c'+(S.issues.length+1),type:r.type,addr:r.addr,brgy:r.brgy,status:'verified',rel:1,x:r.pt.x,y:r.pt.y,upd:0,dist:0.3};S.issues.push(iss);r.issue=iss.id}
  const before=snap();addPoints(30,'Report verified: #'+r.id);notify('shield','Your report #'+r.id+' has been verified.','rep:'+r.id);notify('star','You earned +30 points for a verified report.','rewards');
  const b=checkBadges();render(false);celebrate({title:'Report verified!',sub:'#'+r.id+' · '+TYPES[r.type].l,pts:30+b.length*25,before:before,badges:b,cta:'Continue'});return;
 }
 const iss=S.issues.find(x=>x.id===r.issue);if(iss){iss.status=ns;iss.upd=0}
 notify(ns==='progress'?'wrench':'check',ns==='progress'?'Your reported '+TYPES[r.type].l.toLowerCase()+' is now In Progress.':'Your report #'+r.id+' has been marked Resolved.','rep:'+r.id);
 toast('Status updated to '+ST[ns].l);render(false);
}
function stillOcc(id){
 const r=S.reports.find(x=>x.id===id);r.still++;
 r.tl.push({s:'note',d:TK,note:'You reported that the problem is still occurring. The barangay office was notified.'});
 const iss=S.issues.find(x=>x.id===r.issue);
 if(r.status==='resolved'){r.status='progress';r.tl.push({s:'progress',d:TK,note:'Reopened for review after a persistence report.'});if(iss){iss.status='progress';iss.upd=0}}
 if(iss){iss.rel++;iss.upd=0}
 notify('flag','Thanks. We told the barangay that the problem at '+r.addr+' is still occurring.','rep:'+id);
 toast('Admin notified: problem still occurring','flag');render(false);
}
function notifGo(n){
 n.read=true;const r=n.r||'';
 if(r.startsWith('rep:'))go('repDetail',{id:r.slice(4)});
 else if(r==='trackAdd')trackAdd();
 else if(r==='badges'||r==='goals'||r==='challenges')go(r);
 else if(r==='rewards')setTab('rewards');
 else if(r==='track')setTab('track');
 else render(false);
}
function trackAdd(m){F.trackTab='add';if(m)F.billMonth=m;F.method='bill';setTab('track')}

const A={

  const map={trackAdd:()=>trackAdd(),trackTab:()=>{F.trackTab='overview';setTab('track')},mapView:()=>{if(d.id)F.mapSel=d.id;go('mapView',{id:d.id})}};
  if(map[d.r])return map[d.r]();
  go(d.r,{id:d.id},!!d.replace)},
 back(){back()},tab(d){if(d.t==='track'){F.trackTab=F.trackTab||'overview'}setTab(d.t)},closeSheet(){closeSheet()},closeCele(){closeCele()},
 demoLogin(){S=seed();F={};W=newW();enterApp()},

  F.acct={name:F.suName.trim(),email:F.suEmail.trim(),brgy:F.suBrgy||'Brgy. Holy Spirit'};F.su={people:4,practices:[],source:'bill',monthly:'',goal:'5'};F.sstep=1;F.err=null;go('setup',{})},

 suGoal(d){F.su.goal=d.v;render(false)},
 suEstimate(){F.suMonthly=String(f1(F.su.people*5.2));F.su.monthly=F.suMonthly;render(false)},
 suNext(){F.err=null;
  if(F.sstep===3){const v=parseFloat(F.suMonthly);if(!(v>0)){F.err={suMonthly:'Enter your monthly consumption in m³, or tap “Estimate for my household”.'};render(false);return}F.su.monthly=String(v)}
  if(F.sstep<4){F.sstep++;render(true)}else go('baseline',{})},
 finishSetup(){const a=F.acct||{},su=F.su;S=seed({name:a.name,email:a.email,brgy:a.brgy,people:su.people,practices:su.practices.length?su.practices:null,monthly:parseFloat(su.monthly)||19.9,method:su.source,goalPct:parseInt(su.goal,10)});F={};W=newW();enterApp()},
 trackTab(d){F.trackTab=d.v;render(true)},
 method(d){F.method=d.v;render(false)},
 quickBill(d){F.billVal=d.v;render(false)},quickMeter(){F.meterVal='1224.7';render(false)},
 saveBill(){saveBill()},saveMeter(){saveMeter()},
 barTap(d){if(S.records[d.k])editRec(d.k);else{F.trackTab='add';F.method='bill';F.billMonth=d.k;render(true)}},
 fillMonth(d){F.trackTab='add';F.method='bill';F.billMonth=d.k;setTab('track')},
 editRec(d){editRec(d.k)},
 saveEdit(d){const v=parseFloat(F.eVal);if(!(v>0)){$('#eErr').innerHTML='<div class="err">Enter a valid consumption.</div>';return}const r=S.records[d.k];r.val=v;const a=parseFloat(F.eAmt);r.amount=a>0?a:null;closeSheet();toast('Record updated');render(false)},
 delRec(d){if(rkeys().length<=2){toast('Keep at least two records for comparisons','info');return}delete S.records[d.k];closeSheet();toast('Record deleted');render(false)},
 acceptGoal(){const r=recommend();S.goal={pct:r.pct,base:r.base,target:r.target,monthKey:r.monthKey};toast('Goal accepted: under '+f1(r.target)+' m³');render(false)},
 adjustGoal(){adjustGoal()},
 saveAdj(d){const p=parseInt(F.adj,10),base=parseFloat(d.base),tg=Math.round(base*(1-p/100)*10)/10;const mkk=S.goal?S.goal.monthKey:recommend().monthKey;S.goal={pct:p,base:base,target:tg,monthKey:mkk};closeSheet();toast('Goal saved: '+p+'% less');render(false)},
 openCh(d){openCh(d.id)},
 chPhoto(){CS.photo={kind:'upload'};const c=CH.find(x=>x.id===CS.id);$('#chPhoto').innerHTML='<div class="mt12">'+photoArt(c.id==='leak'?'meter':'plants','Proof photo attached')+'</div><div class="note ok">'+ic('check',18)+'<div>Photo attached (demo placeholder).</div></div>'},
 complete(d){const c=CH.find(x=>x.id===d.id);if(d.home&&c.photo){openCh(d.id);return}if(d.home)CS={id:d.id};completeChallenge(d.id,!!d.home)},
 badgeInfo(d){const b=BADGES.find(x=>x.id===d.id),e=!!S.badges[b.id];sheet('<div class="center" style="text-align:center"><div class="badge '+(e?'':'locked')+'" style="width:84px;height:84px">'+ic(e?b.icon:'lock',40)+'</div><h3>'+b.name+'</h3><p class="sm muted" style="margin:6px 0">'+b.desc+'</p>'+(e?'<span class="chip ok">Earned '+dFmt(S.badges[b.id])+'</span>':'<div class="bar lt mt12"><i style="width:'+Math.round(b.p()/b.max*100)+'%"></i></div><div class="xs muted mt8">Progress: '+b.p()+' of '+b.max+'</div>')+'</div><button class="btn btn-p block mt16" data-act="closeSheet">Close</button>')},
 startReport(){startReport()},
 reportTab(d){F.reportTab=d.v;render(true)},
 repFilter(d){F.repFilter=d.v;render(false)},
 wType(d){W.type=d.v;W.err=null;render(false)},
 wSev(d){W.sev=d.v;W.err=null;render(false)},
 wSample(){W.desc='Water is leaking from a cracked pipe near the corner and flowing across the road. It has been running since this morning.';render(false)},
 wLocate(){if(W.locating)return;W.locating=true;W.pick=false;render(false);setTimeout(()=>{const l=nearest(ME.x,ME.y);W.loc={x:ME.x,y:ME.y,addr:l.addr,brgy:l.brgy};W.locating=false;W.err=null;mark('location');if(R.name==='report')render(false)},1100)},
 wPick(){W.pick=!W.pick;render(false)},
 mapPick(d,el,e){if(!W.pick){toast('Tap “Select on map” first, then tap the map','info');return}const r=el.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*360),y=Math.round((e.clientY-r.top)/r.height*440),l=nearest(x,y);W.loc={x:clamp(x,16,344),y:clamp(y,40,430),addr:l.addr,brgy:l.brgy};W.err=null;mark('location');render(false)},
 wPhoto(d){W.photo={kind:d.v};W.err=null;mark('photo');render(false)},wPhotoRm(){W.photo=null;render(false)},
 wBack(){W.err=null;W.step=Math.max(1,W.step-1);render(true)},wNext(){wNext()},wStep(d){W.step=+d.v;W.err=null;render(true)},
 wReset(){W=newW();render(true)},
 viewNew(d){W=newW();F.reportTab='mine';go('repDetail',{id:d.id})},
 advance(d){advance(d.id)},still(d){stillOcc(d.id)},

 mapBg(){F.mapSel=null;render(false)},
 alsoAffected(d){const i=S.issues.find(x=>x.id===d.id);if(i._me){toast('You already confirmed this issue','info');return}i._me=true;i.rel++;toast('Thanks. Added to the related reports count');render(false)},
 groupInfo(){groupInfo()},
 rewTab(d){F.rewTab=d.v;render(true)},
 redeem(d){redeemSheet(d.id)},

/* =====================================================================
   Events
===================================================================== */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el,e)}
});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:0,clientY:0}))}
 if(e.key==='Escape'){closeSheet()}
});
function bindVal(t){
 const k=t.dataset.f;if(!k)return;
 if(k==='wDesc'){W.desc=t.value;const c=$('#descCount');if(c)c.textContent=W.desc.length+'/300';return}
 if(k==='wDate'){W.date=t.value;return}if(k==='wTime'){W.time=t.value;return}
 if(k==='suMonthly'){F.suMonthly=t.value;return}
 if(k==='adjR'){F.adj=t.value;const b=parseFloat(t.dataset.base),p=parseInt(t.value,10);$('#adjP').textContent=p+'%';$('#adjT').textContent=f1(b*(1-p/100));return}
 F[k]=t.value;
}
document.addEventListener('input',e=>bindVal(e.target));
document.addEventListener('change',e=>{
 bindVal(e.target);
 if(e.target.dataset.rerender){render(false)}
});

/* boot */
render(true);
})();
